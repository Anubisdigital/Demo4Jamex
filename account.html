<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Account | Jamex Marketing Agency</title>
  <link rel="icon" type="image/png" href="jamex.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', 'Helvetica Neue', sans-serif;
      border-radius: 0 !important;
      text-decoration: none;
      list-style: none;
      outline: none;
      box-shadow: none !important;
    }
    body {
      background-color: #FFFFFF;
      color: #333333;
      overflow-x: hidden;
      line-height: 1.6;
    }
    :root {
      --primary: #37B2F9;
      --white: #FFFFFF;
      --black: #000000;
      --gray-light: #F9F9F9;
      --gray-mid: #EEEEEE;
      --text-dark: #222222;
    }
    header {
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: var(--white);
      position: fixed;
      top: 0;
      z-index: 2000;
      border-bottom: 2px solid var(--gray-mid);
    }
    .logo-container img {
      height: 60px;
      display: block;
    }
    .menu-toggle {
      width: 40px;
      height: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 2100;
    }
    .bar {
      width: 100%;
      height: 4px;
      background-color: var(--black);
      transition: all 0.3s ease;
    }
    .menu-toggle.open .bar:nth-child(1) {
      transform: translateY(13px) rotate(45deg);
      background-color: var(--primary);
    }
    .menu-toggle.open .bar:nth-child(2) {
      opacity: 0;
    }
    .menu-toggle.open .bar:nth-child(3) {
      transform: translateY(-13px) rotate(-45deg);
      background-color: var(--primary);
    }
    .side-nav {
      position: fixed;
      top: 0;
      right: -100%;
      width: 350px;
      height: 100vh;
      background: var(--white);
      z-index: 2050;
      display: flex;
      flex-direction: column;
      padding: 100px 40px 40px 40px;
      transition: right 0.5s cubic-bezier(0.77, 0, 0.175, 1);
      border-left: 5px solid var(--primary);
      overflow-y: auto;
    }
    .side-nav.active {
      right: 0;
    }
    .side-nav-close {
      position: absolute;
      top: 25px;
      right: 30px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: black;
      background: transparent;
      cursor: pointer;
      transition: 0.2s;
    }
    .side-nav-close:hover {
      color: var(--primary);
    }
    .side-nav a {
      font-size: 1.4rem;
      color: var(--black);
      margin-bottom: 30px;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 2px solid transparent;
      width: fit-content;
      transition: 0.2s;
    }
    .side-nav a:hover, .side-nav a.nav-active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    .nav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
      z-index: 2040;
    }
    .nav-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .page-content {
      padding-top: 130px;
      padding-bottom: 80px;
      background: var(--white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .account-card {
      max-width: 500px;
      width: 90%;
      margin: 0 auto;
      background: var(--white);
      border: 2px solid var(--gray-mid);
      transition: border-color 0.2s;
    }
    .account-card:hover {
      border-color: var(--primary);
    }
    .card-header {
      background: var(--gray-light);
      padding: 25px;
      text-align: center;
      border-bottom: 2px solid var(--gray-mid);
    }
    .card-header h2 {
      font-size: 1.8rem;
      text-transform: uppercase;
      color: var(--black);
      letter-spacing: 1px;
    }
    .card-body {
      padding: 30px;
    }
    .toggle-buttons {
      display: flex;
      gap: 0;
      margin-bottom: 30px;
      border: 2px solid var(--gray-mid);
    }
    .toggle-btn {
      flex: 1;
      text-align: center;
      padding: 12px;
      background: var(--white);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      border: none;
      font-size: 0.9rem;
    }
    .toggle-btn.active {
      background: var(--primary);
      color: white;
    }
    .form-group {
      margin-bottom: 22px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: var(--text-dark);
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 2px solid #ddd;
      background: var(--white);
      color: #333;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--primary);
    }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      border: 2px solid var(--primary);
      transition: 0.2s;
      font-size: 1rem;
    }
    .btn-primary:hover {
      background: white;
      color: var(--primary);
    }
    .divider {
      text-align: center;
      margin: 25px 0;
      position: relative;
    }
    .divider span {
      background: var(--white);
      padding: 0 15px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #999;
      text-transform: uppercase;
    }
    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gray-mid);
      z-index: -1;
    }
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border: 2px solid var(--gray-mid);
      background: var(--white);
      transition: 0.2s;
    }
    .social-btn i {
      font-size: 1.2rem;
    }
    .social-btn.google:hover {
      border-color: #DB4437;
      color: #DB4437;
    }
    .social-btn.apple:hover {
      border-color: #000;
      color: #000;
    }
    .error-message {
      background: #ffefef;
      border: 1px solid #ffb3b3;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #c00;
      text-transform: uppercase;
      text-align: center;
    }
    .success-message {
      background: #e6f5e6;
      border: 1px solid #a3d9a5;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #2e7d32;
      text-transform: uppercase;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-bottom-color: transparent;
      border-radius: 50% !important;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden {
      display: none;
    }
    @media (max-width: 550px) {
      .card-body { padding: 20px; }
      .social-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="nav-overlay" id="overlay"></div>

<header>
  <div class="logo-container">
    <img src="jamex.png" alt="Jamex Marketing Agency Logo">
  </div>
  <div class="menu-toggle" id="menuBtn">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</header>

<nav class="side-nav" id="sideNav">
  <div class="side-nav-close" id="closeSideNavX">X</div>
  <a href="index.html">Home</a>
  <a href="apply.html">Apply Now</a>
  <a href="gallery.html">Gallery</a>
  <a href="location.html">Location</a>
  <a href="contact.html">Contact Us</a>
  <div style="margin-top: auto; border-top: 1px solid var(--gray-mid); padding-top: 30px;">
    <p style="font-size: 0.8rem; color: #999; text-transform: uppercase;">Direct Line</p>
    <p style="font-weight: bold; color: var(--primary);">+256 704 242193</p>
  </div>
</nav>

<main class="page-content">
  <div class="account-card">
    <div class="card-header">
      <h2>Account Access</h2>
    </div>
    <div class="card-body">
      <div id="messageArea"></div>

      <div class="toggle-buttons">
        <button id="loginTabBtn" class="toggle-btn active">Login</button>
        <button id="signupTabBtn" class="toggle-btn">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button id="loginBtn" class="btn-primary">Sign In</button>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupForm" style="display: none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="minimum 6 characters">
        </div>
        <button id="signupBtn" class="btn-primary">Create Account</button>
      </div>

      <div class="divider"><span>OR</span></div>

      <div class="social-grid">
        <button id="googleBtn" class="social-btn google"><i class="fab fa-google"></i> Google</button>
        <button id="appleBtn" class="social-btn apple"><i class="fab fa-apple"></i> Apple</button>
      </div>
    </div>
  </div>
</main>

<footer style="background: var(--black); color: var(--white); padding: 30px 6%; text-align: center; font-size: 0.8rem;">
  &copy; 2026 Jamex Marketing Agency | Kampala, Uganda. All Rights Reserved.
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, OAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDDd7UUS03MeQyTF-3B29rX54RQkKXMqkk",
    authDomain: "jamex2.firebaseapp.com",
    projectId: "jamex2",
    storageBucket: "jamex2.firebasestorage.app",
    messagingSenderId: "275547773610",
    appId: "1:275547773610:web:84ec3a054460c2c668ced3",
    measurementId: "G-8TLQ808DHS"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();
  const appleProvider = new OAuthProvider('apple.com');

  const loginTab = document.getElementById('loginTabBtn');
  const signupTab = document.getElementById('signupTabBtn');
  const loginFormDiv = document.getElementById('loginForm');
  const signupFormDiv = document.getElementById('signupForm');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const googleBtn = document.getElementById('googleBtn');
  const appleBtn = document.getElementById('appleBtn');
  const messageArea = document.getElementById('messageArea');

  const WORKER_URL = 'https://jemaxma-site.lubegadoreen02.workers.dev';

  function showMessage(msg, isError = true) {
    messageArea.innerHTML = `<div class="${isError ? 'error-message' : 'success-message'}">${msg}</div>`;
    setTimeout(() => {
      if (messageArea.innerHTML.includes(msg)) messageArea.innerHTML = '';
    }, 5000);
  }

  async function sendWelcomeEmail(email, name) {
    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name: name || email.split('@')[0] })
      });
      await response.json();
    } catch (err) {
      // Silent fail – email error should not block the user
    }
  }

  async function storeUserIfNeeded(user, displayName) {
    const userRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(userRef);
    if (!docSnap.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        email: user.email,
        name: displayName || user.displayName || user.email.split('@')[0],
        createdAt: new Date().toISOString(),
        provider: user.providerData[0]?.providerId || 'email'
      });
      return true;
    }
    return false;
  }

  // ✅ FIXED: Firestore failure no longer blocks email sending
  async function handleAuthSuccess(user, providedName = null) {
    const nameToSend = providedName || user.displayName || user.email.split('@')[0];
    try {
      const isNew = await storeUserIfNeeded(user, providedName);
      if (isNew) {
        await sendWelcomeEmail(user.email, nameToSend);
      }
    } catch (err) {
      // Firestore failed – still send welcome email
      await sendWelcomeEmail(user.email, nameToSend);
    }
    window.location.href = 'index.html';
  }

  // ---------- LOGIN ----------
  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) {
      showMessage('Email and password required');
      return;
    }
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="loader"></span> Signing In...';
    try {
      const userCred = await signInWithEmailAndPassword(auth, email, password);
      await handleAuthSuccess(userCred.user);
    } catch (err) {
      let errorMsg = 'Login failed. ';
      if (err.code === 'auth/user-not-found') errorMsg += 'No account found.';
      else if (err.code === 'auth/wrong-password') errorMsg += 'Incorrect password.';
      else errorMsg += err.message;
      showMessage(errorMsg);
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Sign In';
    }
  });

  // ---------- SIGNUP ----------
  signupBtn.addEventListener('click', async () => {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!name || !email || !password) {
      showMessage('All fields are required');
      return;
    }
    if (password.length < 6) {
      showMessage('Password must be at least 6 characters');
      return;
    }
    signupBtn.disabled = true;
    signupBtn.innerHTML = '<span class="loader"></span> Creating Account...';
    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      await handleAuthSuccess(userCred.user, name);
    } catch (err) {
      let errorMsg = 'Signup failed. ';
      if (err.code === 'auth/email-already-in-use') errorMsg += 'Email already registered.';
      else errorMsg += err.message;
      showMessage(errorMsg);
      signupBtn.disabled = false;
      signupBtn.innerHTML = 'Create Account';
    }
  });

  // ---------- GOOGLE ----------
  googleBtn.addEventListener('click', async () => {
    googleBtn.disabled = true;
    googleBtn.innerHTML = '<span class="loader"></span> Google...';
    try {
      const result = await signInWithPopup(auth, googleProvider);
      await handleAuthSuccess(result.user);
    } catch (err) {
      showMessage('Google sign in failed: ' + err.message);
      googleBtn.disabled = false;
      googleBtn.innerHTML = '<i class="fab fa-google"></i> Google';
    }
  });

  // ---------- APPLE ----------
  appleBtn.addEventListener('click', async () => {
    appleBtn.disabled = true;
    appleBtn.innerHTML = '<span class="loader"></span> Apple...';
    try {
      const result = await signInWithPopup(auth, appleProvider);
      await handleAuthSuccess(result.user);
    } catch (err) {
      showMessage('Apple sign in failed: ' + err.message);
      appleBtn.disabled = false;
      appleBtn.innerHTML = '<i class="fab fa-apple"></i> Apple';
    }
  });

  // ---------- TAB TOGGLE ----------
  loginTab.addEventListener('click', () => {
    loginTab.classList.add('active');
    signupTab.classList.remove('active');
    loginFormDiv.style.display = 'block';
    signupFormDiv.style.display = 'none';
  });
  signupTab.addEventListener('click', () => {
    signupTab.classList.add('active');
    loginTab.classList.remove('active');
    loginFormDiv.style.display = 'none';
    signupFormDiv.style.display = 'block';
  });

  // ---------- AUTH STATE ----------
  onAuthStateChanged(auth, (user) => {
    if (user && window.location.pathname.includes('account.html')) {
      window.location.href = 'index.html';
    }
  });

  // ---------- NAV DRAWER ----------
  const menuBtn = document.getElementById('menuBtn');
  const sideNav = document.getElementById('sideNav');
  const overlay = document.getElementById('overlay');
  const closeX = document.getElementById('closeSideNavX');

  function closeMenu() {
    menuBtn.classList.remove('open');
    sideNav.classList.remove('active');
    overlay.classList.remove('active');
    document.body.style.overflow = 'auto';
  }
  function openMenu() {
    menuBtn.classList.add('open');
    sideNav.classList.add('active');
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function toggleMenu() {
    sideNav.classList.contains('active') ? closeMenu() : openMenu();
  }
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
  overlay.addEventListener('click', closeMenu);
  closeX.addEventListener('click', (e) => { e.stopPropagation(); closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sideNav.classList.contains('active')) closeMenu(); });

  // ---------- SOUND ----------
  function playButtonSound() {
    try {
      const audio = new Audio('jx.mp3');
      audio.volume = 0.4;
      audio.play().catch(() => {});
    } catch (err) {}
  }
  document.body.addEventListener('click', (event) => {
    const target = event.target.closest('.menu-toggle, .side-nav-close, .side-nav a, .btn-primary, .social-btn');
    if (target) playButtonSound();
  });
</script>
</body>
</html>
