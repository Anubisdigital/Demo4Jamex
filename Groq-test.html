<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI Chat</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat-box { width: 100%; max-width: 600px; height: 400px; border: 1px solid #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #1e1e1e; border-radius: 8px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
        .user { background: #007bff; align-self: flex-end; }
        .bot { background: #333; }
        .input-area { display: flex; width: 100%; max-width: 600px; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #007bff; color: white; cursor: pointer; }
        button:disabled { background: #555; }
    </style>
</head>
<body>

    <h2>AI Chat Interface</h2>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask something..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // THIS IS YOUR WORKER LINK
        const WORKER_URL = "https://groq-proxy.lubegadoreen02.workers.dev";

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerText = (role === 'user' ? "You: " : "AI: ") + text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt);
            userInput.value = "";
            sendBtn.disabled = true;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) throw new Error("Worker Error");

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                appendMessage('bot', aiResponse);

            } catch (error) {
                appendMessage('bot', "Error: Could not connect to the AI. Check if the Worker is deployed correctly.");
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
